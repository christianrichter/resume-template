# Site settings
title: "Christian Richter – Data Engineer & Cloud Architect"
description: "Christian Richter, independent data engineer and cloud architect in Berlin: data platforms, cloud infrastructure (AWS, GCP, Kubernetes) and AI integration (LLM, MCP)."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Christian Richter"
resume_title:                   "Data Engineer & Cloud Architect"
resume_tagline:                 "Data Platforms · Cloud Infrastructure (AWS, GCP, Kubernetes) · AI Integration (LLM, MCP)"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "hello@crichter.io?subject=Inquiry / Anfrage"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "+49 30 4193 6978"
resume_contact_address:         "Berlin, Germany"

resume_header_contact_info:     "Berlin, Germany • +49 30 4193 6978 • hello@crichter.io"
display_header_contact_info:    "true"

resume_header_intro: "<p>I'm an independent <strong>data engineer and cloud architect</strong> with more than 25 years of experience in software and data engineering, freelancing since 2010. I have delivered 25+ projects for clients in automotive, chemicals, retail, market research, media and telecommunications, taking data platforms from architecture and requirements through to production operation, and I combine hands-on engineering with technical leadership of distributed teams.</p><p>Typical engagement: design the platform, build it with the client team and hand it over.</p><p><strong>Core stack:</strong> Python, SQL, Spark, Kafka, Airflow, dbt, Terraform, Kubernetes, AWS, GCP, MCP</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
