# Services
# Descriptions are the capability bullets of the CV summary (CV_Christian_Richter_EN_2026.docx)
- service: Data platforms
  description: Architecture and delivery of data warehouses, data lakes and lakehouse platforms (AWS, GCP, Kubernetes), from concept to production

- service: Data pipelines & streaming
  description: Design and operation of ETL/ELT, streaming and ML pipelines (Spark, Kafka, Airflow, dbt) at terabyte scale

- service: AI integration
  description: "AI-assisted data processing: document extraction, semantic search and workflow automation with LLM tool integration (MCP), including a self-built MCP server in production"

- service: Cloud infrastructure as code
  description: Cloud-native infrastructure as code (Terraform, Helm, GitOps), including high-availability and disaster-recovery concepts

- service: Data governance & modeling
  description: GDPR-compliant data management including data residency, data modeling, and requirements and process analysis

- service: Technical leadership
  description: Technical leadership of distributed teams, architecture reviews and knowledge transfer

- service: Workshops
  description: Hands-on workshops for your team on cloud data platforms, data pipelines, streaming and AI integration, tailored to your team's level. See <a href="services#workshops">workshops</a> for topics.
